[font]
#size = 15.0
size = 17.0

[font.normal]
#family = "Noto Sans Mono"
#family = "NotoSansM Nerd Font Mono"
family = "Iosevka Nerd Font Mono"
style = "Regular"
#style = "Medium"

[font.bold]
#family = "Noto Sans Mono"
#family = "NotoSansM Nerd Font Mono"
family = "Iosevka Nerd Font Mono"
style = "Medium"

#family = "MesloLGS Nerd Font Mono"

[scrolling]
history = 0

[keyboard]
bindings = [
  # Zoom In (Cmd + +) and (Cmd + =)
  # We add "Equals" because physically pressing "+" usually requires Shift on keyboards
  { key = "Plus",   mods = "Command", action = "IncreaseFontSize" },
  { key = "Equals", mods = "Command", action = "IncreaseFontSize" },

  # Zoom Out (Cmd + -)
  { key = "Minus",  mods = "Command", action = "DecreaseFontSize" },

  # Reset Zoom (Cmd + 0)
  { key = "0",      mods = "Command", action = "ResetFontSize" }
]

[window]
# This makes both Left and Right Option keys act as Alt
option_as_alt = "Both"
